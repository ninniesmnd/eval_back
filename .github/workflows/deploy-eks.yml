name: CI/CD Backend Despacho EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ECR_REPO_BACKEND_DESPACHOS: backend-despachos
  ECR_REPO_BACKEND_VENTAS: backend-ventas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag de imagen
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & push BACKEND DESPACHOS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker build -t $ECR_REGISTRY/${ECR_REPO_BACKEND_DESPACHOS}:${IMAGE_TAG} -t $ECR_REGISTRY/${ECR_REPO_BACKEND_DESPACHOS}:latest .
          docker push $ECR_REGISTRY/${ECR_REPO_BACKEND_DESPACHOS}:${IMAGE_TAG}
          docker push $ECR_REGISTRY/${ECR_REPO_BACKEND_DESPACHOS}:latest

      - name: Build & push BACKEND VENTAS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          docker build -t $ECR_REGISTRY/${ECR_REPO_BACKEND_VENTAS}:${IMAGE_TAG} -t $ECR_REGISTRY/${ECR_REPO_BACKEND_VENTAS}:latest .
          docker push $ECR_REGISTRY/${ECR_REPO_BACKEND_VENTAS}:${IMAGE_TAG}
          docker push $ECR_REGISTRY/${ECR_REPO_BACKEND_VENTAS}:latest

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configurar kubeconfig para EKS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
          kubectl config current-context

      - name: Aplicar namespace y DB
        env:
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/mysql-secret.yaml -n $EKS_NAMESPACE
          kubectl apply -f k8s/mysql-deployment.yaml -n $EKS_NAMESPACE
          kubectl apply -f k8s/mysql-service.yaml -n $EKS_NAMESPACE

      - name: Esperar a que MySQL esté listo
        env:
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl rollout status deployment/mysql-db -n $EKS_NAMESPACE

      - name: Actualizar BACKEND DESPACHOS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl apply -f k8s/backend-despachos-deployment.yaml -n $EKS_NAMESPACE
          kubectl apply -f k8s/backend-despachos-service.yaml -n $EKS_NAMESPACE
          kubectl set image deployment/backend-despachos \
            backend-despachos=$ECR_REGISTRY/${ECR_REPO_BACKEND_DESPACHOS}:${IMAGE_TAG} \
            -n $EKS_NAMESPACE
          kubectl rollout status deployment/backend-despachos -n $EKS_NAMESPACE

      - name: Actualizar BACKEND VENTAS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl apply -f k8s/backend-ventas-deployment.yaml -n $EKS_NAMESPACE
          kubectl apply -f k8s/backend-ventas-service.yaml -n $EKS_NAMESPACE
          kubectl set image deployment/backend-ventas \
            backend-ventas=$ECR_REGISTRY/${ECR_REPO_BACKEND_VENTAS}:${IMAGE_TAG} \
            -n $EKS_NAMESPACE
          kubectl rollout status deployment/backend-ventas -n $EKS_NAMESPACE

      - name: Aplicar HPA backends
        env:
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl apply -f k8s/backend-despachos-hpa.yaml -n $EKS_NAMESPACE
          kubectl apply -f k8s/backend-ventas-hpa.yaml -n $EKS_NAMESPACE

      - name: Cargar datos de prueba (solo si la BD está vacía)
        env:
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          MYSQL_POD=$(kubectl get pods -n $EKS_NAMESPACE -l app=mysql-db -o jsonpath="{.items[0].metadata.name}")
          ROW_COUNT=$(kubectl exec -n $EKS_NAMESPACE $MYSQL_POD -- mysql -uroot -padmin123 -N -e "SELECT COUNT(*) FROM appdb.venta;")
          if [ "$ROW_COUNT" -eq "0" ]; then
            echo "Base de datos vacía, cargando datos de prueba..."
            kubectl cp db/init.sql $EKS_NAMESPACE/$MYSQL_POD:/tmp/init.sql
            kubectl exec -n $EKS_NAMESPACE $MYSQL_POD -- bash -c "mysql -uroot -padmin123 appdb < /tmp/init.sql"
          else
            echo "Ya hay datos en la base ($ROW_COUNT filas en venta), se omite la carga."
          fi

      - name: Ver pods y servicios
        env:
          EKS_NAMESPACE: ${{ secrets.EKS_NAMESPACE }}
        run: |
          kubectl get pods -n $EKS_NAMESPACE
          kubectl get svc -n $EKS_NAMESPACE