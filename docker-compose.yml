version: '3.8'

services:
  back-despachos:
    image: 511164404052.dkr.ecr.us-east-1.amazonaws.com/back-despachos:despachos
    container_name: back-despachos-container
    ports:
      - "8081:8080"
    environment:
      - DB_ENDPOINT=10.0.5.66
      - DB_PORT=3306
      - DB_NAME=bd_evaluacion
      - DB_USERNAME=root
      - DB_PASSWORD=root
    restart: always
    networks:
      - eval-network

  back-ventas:
    image: 511164404052.dkr.ecr.us-east-1.amazonaws.com/back-despachos:ventas
    container_name: back-ventas-container
    ports:
      - "8082:8080"
    environment:
      - DB_ENDPOINT=10.0.5.66
      - DB_PORT=3306
      - DB_NAME=bd_evaluacion
      - DB_USERNAME=root
      - DB_PASSWORD=root
    restart: always
    networks:
      - eval-network

networks:
  eval-network:
    driver: bridge