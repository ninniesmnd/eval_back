version: '3.8'

services:

  db-evaluacion:
    image: mysql:8.0.46
    container_name: db-evaluacion
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bd_evaluacion
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    networks:
      - pawville-network

  back-despachos:
    image: 511164404052.dkr.ecr.us-east-1.amazonaws.com/back-despachos:despachos
    container_name: back-despachos-container
    ports:
      - "8081:8080"
    environment:
      - DB_ENDPOINT=10.0.5.66
      - DB_PORT=3306
      - DB_NAME=bd_evaluacion
      - DB_USERNAME=root
      - DB_PASSWORD=root
    restart: always
    depends_on:
      - db-evaluacion
    networks:
      - pawville-network

  back-ventas:
    image: 511164404052.dkr.ecr.us-east-1.amazonaws.com/back-despachos:ventas
    container_name: back-ventas-container
    ports:
      - "8082:8080"
    environment:
      - DB_ENDPOINT=10.0.5.66
      - DB_PORT=3306
      - DB_NAME=bd_evaluacion
      - DB_USERNAME=root
      - DB_PASSWORD=root
    restart: always
    depends_on:
      - db-evaluacion
    networks:
      - pawville-network

networks:
  pawville-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local